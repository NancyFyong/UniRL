# VideoHPSv3-only service configuration (WAN2.1 T2V / Flash-GRPO).
#
# Deploy on a dedicated node (1 GPU for the Qwen2-VL-7B HPSv3 backbone).
# The training node connects via REWARD_SERVICE_URL=http://<this_node_ip>:8080.
#
# Start:
#   ray start --head --port=6379 --num-gpus=1
#   python -m reward_service --config configs/videohpsv3_service.yaml
#
# Consumer recipe: examples/diffusion/wan21/wan21_t2v_flashgrpo_sglang_videohpsv3.yaml
# (relative to the UniRL repo root).

server:
  host: 0.0.0.0
  port: 8080
  # Minutes, not seconds. `RewardService.score_and_attach` is DP_SCATTER-
  # dispatched, so every training rank POSTs its own shard concurrently; with 8
  # replicas each rank gets its own actor, but `_await_ref` starts its clock at
  # dispatch, so any queue wait still counts against this deadline. A 64-clip
  # step (8 prompts x 8 samples, 81 frames) is 704 frame scorings at the
  # frame_stride below, 5184 at stride 1 — i.e. 176 vs 1296 forwards at
  # max_batch_size 4, spread over the replicas. On timeout the Ray task keeps
  # running (see server._await_ref), so the GPU time is spent and then discarded.
  score_timeout_s: 1800.0

rewards:
  - name: videohpsv3
    scorer: videohpsv3
    # Shares the image scorer's env — identical deps (opencv-python-headless is
    # already in there), so Ray reuses one cached venv for hpsv3 + videohpsv3.
    runtime_env: envs/hpsv3.txt
    # One replica per GPU. This service runs on its own Ray cluster (separate
    # port + temp-dir from the trainer's), so these 8 GPUs are the same physical
    # devices the trainer holds — deliberate over-subscription: HPSv3's ~17 GB of
    # bf16 weights fit alongside the ~48 GB training footprint on a 97 GB H20.
    num_replicas: 8
    num_gpus: 1
    num_cpus: 4
    max_concurrency: 1
    params:
      # HF repo id — downloaded on first actor init and served from the hub
      # cache afterwards. A local directory containing HPSv3.safetensors (or
      # the file itself) also works, for nodes without egress.
      weights_path: MizzenAI/HPSv3
      config_path: null
      max_batch_size: 4       # frames per forward; 8 OOMs a 95GB H20
      # 1 = exact upstream Flash-GRPO semantics: every frame scored, top-30% of
      # 81 = 24 frames averaged. Raising this is a reward-hacking hole, not an
      # optimization — at stride 8 only 11 frames are scored and top_ratio_mean
      # keeps 3, leaving 78 frames unconstrained. Measured cost is small: the
      # reward call is ~0.8% of a training step (8.2s of 1029s at stride 8), so
      # stride 1 is ~60s, +4.6% step time, ~30x under score_timeout_s.
      frame_stride: 1
      top_ratio: 0.3          # keep the best 30% of frames
